services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nerukigat
      POSTGRES_USER: nerukigat
      POSTGRES_PASSWORD: nerukigat-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerukigat -d nerukigat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nerukigat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nerukigat-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nerukigat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nerukigat-local-secret}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-nerukigat-public}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-nerukigat-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_PUBLIC_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_PRIVATE_BUCKET}"
        mc anonymous set download "local/$${MINIO_PUBLIC_BUCKET}"
        mc anonymous set none "local/$${MINIO_PRIVATE_BUCKET}"
    restart: "no"

volumes:
  postgres_data:
  minio_data:
